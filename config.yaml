      - {source: fred, dataset: series_weekly, symbol: NFCI, tier: 3}
  # T49 (P-021c): CFTC Commitments of Traders, legacy futures-only report, weekly (1w, as of
  # the position Tuesday). Symbol = <CFTC contract market code>:<field>. docs/sources/cftc.md
