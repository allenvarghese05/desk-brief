# Desk Brief configuration. Validated by deskbrief.config (python -m deskbrief.config).
# Thresholds are starting values; every tuning is recorded in INCIDENTS.md ("false alarm tuned").
# Items marked VERIFY must be confirmed against the live source by the matching source card.
version: 1
timezone_report: America/New_York

storage:
  backend: local          # local for dev/tests; workflows set DESKBRIEF_STORAGE_BACKEND=r2
  bucket: deskbrief-data
  local_root: ./.data

sources:
  alpaca:     {rate_per_min: 180, timeout_s: 10, retries: 3}
  twelvedata: {rate_per_min: 7, daily_budget: 750, timeout_s: 10, retries: 2}
  fred:       {rate_per_min: 100, timeout_s: 15, retries: 3}
  treasury:   {rate_per_min: 30, timeout_s: 20, retries: 3}
  ecb:        {rate_per_min: 30, timeout_s: 15, retries: 3}
  # Stooq is off by owner decision (2026-11-18): every automated request gets a JavaScript
  # browser-verification page, not the CSV. Details: docs/sources/stooq.md.
  stooq:      {rate_per_min: 20, timeout_s: 15, retries: 2, enabled: false}
  yahoo:      {rate_per_min: 30, timeout_s: 15, retries: 2}
  cboe:       {rate_per_min: 10, timeout_s: 15, retries: 2}   # T25/T47: live probes 2026-11-18 and 2026-11-19 (docs/sources/cboe.md)
  # T49: CFTC public reporting (Socrata, keyless); one request per run. docs/sources/cftc.md
  cftc:       {rate_per_min: 10, timeout_s: 30, retries: 3,
               user_agent: "desk-brief/0.1 (+https://github.com/allenvarghese05/desk-brief)"}
  # P-024 / T65: Treasury upcoming auctions -> events (keyless). Off until the owner's live probe
  # (python scripts/probes/probe_t65_fiscaldata.py; docs/sources/fiscaldata.md).
  fiscaldata: {rate_per_min: 30, timeout_s: 20, retries: 3, enabled: false}
  # T65: SEC EDGAR -> filings, for filings.companies / filings.holders (docs/sources/edgar.md). Off
  # until the owner sets the secret and runs scripts/probes/probe_t65_edgar.py.
  # SEC fair access: at most 10 requests per second (600/min; config rejects more). The contact
  # User-Agent is read from the secret named here and is never committed or logged.
  edgar:      {rate_per_min: 300, timeout_s: 20, retries: 2, enabled: false,
               user_agent_env: DESKBRIEF_SEC_USER_AGENT}

instruments:
  # ---------------- Equities (ETFs and portfolio stocks) ----------------
  - id: SPY
    name: SPDR S&P 500 ETF
    asset_class: equity
    kind: etf
    unit: USD
    is_proxy: true
    label: proxy for the S&P 500
    feeds:
      - {source: alpaca, dataset: iex_latest, symbol: SPY, tier: 1}
      - {source: alpaca, dataset: iex_bars_1m, symbol: SPY, tier: 1}
      - {source: alpaca, dataset: sip_bars_1m, symbol: SPY, tier: 2}
      - {source: yahoo, dataset: quote, symbol: SPY, tier: 2}
      - {source: yahoo, dataset: history, symbol: SPY, tier: 2}       # P-019 primary daily close
      - {source: stooq, dataset: daily, symbol: spy.us, tier: 3}
