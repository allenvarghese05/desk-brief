  - id: COT_GC_OI
    name: Gold (COMEX) futures, open interest (CFTC COT)
    asset_class: macro
    kind: macro
    unit: contracts
    feeds:
      - {source: cftc, dataset: cot, symbol: "088691:open_interest", tier: 3}
  - id: COT_ES_OI
    name: E-mini S&P 500 (CME) futures, open interest (CFTC COT)
    asset_class: macro
    kind: macro
    unit: contracts
    feeds:
      - {source: cftc, dataset: cot, symbol: "13874A:open_interest", tier: 3}
  - id: COT_ZN_OI
    name: 10-year Treasury note (CBOT) futures, open interest (CFTC COT)
    asset_class: macro
    kind: macro
    unit: contracts
    feeds:
      - {source: cftc, dataset: cot, symbol: "043602:open_interest", tier: 3}

groups:
  - {id: sp500, label: S&P 500, proxy: SPY, exact: ES_F, official: SPY, relation: return,
     tolerance: {warn_bps: 30, fail_bps: 100}}
  - {id: nasdaq, label: Nasdaq-100, proxy: QQQ, exact: QQQ, official: QQQ, relation: same,
     tolerance: {warn_bps: 5, fail_bps: 25}}
  - {id: smallcap, label: Russell 2000, proxy: IWM, exact: IWM, official: IWM, relation: same,
     tolerance: {warn_bps: 5, fail_bps: 25}}
  - {id: oil_wti, label: WTI crude, proxy: USO, exact: WTI, official: WTI, relation: return,
     tolerance: {warn_bps: 150, fail_bps: 400}}
  - {id: oil_brent, label: Brent crude, proxy: BNO, exact: BRENT, official: BRENT, relation: return,
     tolerance: {warn_bps: 150, fail_bps: 400}}
  - {id: gold, label: Gold, proxy: GLD, exact: GOLD_F, relation: return,
     tolerance: {warn_bps: 50, fail_bps: 150}}
  - {id: ust_2y, label: US 2-year, proxy: SHY, official: UST_2Y, relation: inverse_duration,
     duration: 1.9, tolerance: {warn_bps: 10, fail_bps: 30}}          # VERIFY duration
  - {id: ust_10y, label: US 10-year, proxy: IEF, exact: UST_10Y, official: UST_10Y,
     relation: inverse_duration, duration: 7.0, tolerance: {warn_bps: 15, fail_bps: 40}}  # VERIFY
  - {id: ust_long, label: US 20-year+, proxy: TLT, official: UST_20Y, relation: inverse_duration,
     duration: 16.5, tolerance: {warn_bps: 40, fail_bps: 100}}        # VERIFY duration
  - {id: ust_3m, label: US 3-month bill, exact: UST_3M, official: UST_3M, relation: level,
     tolerance: {warn_bps: 3, fail_bps: 10}}
  - {id: eurusd, label: EUR/USD, exact: EURUSD, official: EURUSD, relation: level,
     tolerance: {warn_bps: 5, fail_bps: 15}}
  - {id: gbpusd, label: GBP/USD, exact: GBPUSD, official: GBPUSD, relation: level,
     tolerance: {warn_bps: 5, fail_bps: 15}}
  - {id: usdjpy, label: USD/JPY, exact: USDJPY, official: USDJPY, relation: level,
     tolerance: {warn_bps: 5, fail_bps: 15}}
  - {id: vix, label: VIX, exact: VIX, official: VIX, relation: level,
     tolerance: {warn_bps: 50, fail_bps: 200}}

datasets:   # expected publish times drive freshness; before expected_by the check is "skip"
  - {source: treasury, dataset: par_curve, expected_by_et: "18:00", lag_bdays: 0, calendar: SIFMA_US}
  - {source: fred, dataset: series, expected_by_et: "16:30", lag_bdays: 1, calendar: SIFMA_US}
  # T46: NFCI. Chicago Fed releases Wednesdays 08:30 ET with data through the previous Friday
  # (3 weekdays back); a federal holiday on or before Wednesday moves it to Thursday. FRED
  # posted the 2026-11-18 release at 08:35 ET. Source: docs/sources/fred.md.
  - {source: fred, dataset: series_weekly, expected_by_et: "09:30", lag_bdays: 3,
     calendar: SIFMA_US, grace_minutes: 90, release_weekday: 2}
  - {source: ecb, dataset: eurofxref, expected_by_et: "11:00", lag_bdays: 0, calendar: TARGET}
  - {source: stooq, dataset: daily, expected_by_et: "20:00", lag_bdays: 0, calendar: XNYS}
  # T47: covers all seven Cboe symbols. Probe 2026-11-19 15:08 ET: every file ended at 11/18.
  - {source: cboe, dataset: vix_history, expected_by_et: "20:00", lag_bdays: 0, calendar: XNYS}
  # T49: CFTC COT. Released Fridays 15:30 ET with positions as of the Tuesday (3 weekdays back);
  # a federal holiday in the week moves the release to the next business day (Monday in the 2026
  # schedule). SIFMA_US holds the federal holidays. Grace 180 min: the Socrata copy may lag the
  # 15:30 web release. Source: cftc.gov release schedule, probe 2026-11-19, docs/sources/cftc.md.
  - {source: cftc, dataset: cot, expected_by_et: "15:30", lag_bdays: 3, calendar: SIFMA_US,
     grace_minutes: 180, release_weekday: 4}

intraday:   # polled every 15 min in session; newest tick older than grace_minutes is stale (2 missed polls)
  - {source: alpaca, dataset: iex_latest, calendar: XNYS, grace_minutes: 30}
  - {source: yahoo, dataset: quote, calendar: XNYS, grace_minutes: 30}
  - {source: twelvedata, dataset: fx_quote, calendar: XNYS, grace_minutes: 30}

checks:
  anomaly: {window_days: 30, z_warn: 3.0, z_fail: 5.0}
  validity:
    pct: [-2, 25]
    fx_rate: [0.0001, 100000]
    USD: [0.01, 1000000]
    index_pts: [0.01, 1000000]
    index: [-100, 100000]                 # may be negative (NFCI), P-021
    contracts: [-10000000, 100000000]     # net positions may be negative, P-021

crosschecks:
  iex_vs_sip: {symbols: [SPY, QQQ, IWM, GLD, TLT], warn_bps: 5, fail_bps: 20, max_fail_minutes_pct: 5}
  fx_vs_ecb: {pairs: [EURUSD, GBPUSD, USDJPY], fix_time_cet: "14:15", warn_bps: 5, fail_bps: 15}
  official_pair: {pairs: [[DGS2, 2 Yr], [DGS10, 10 Yr], [DGS20, 20 Yr], [DGS30, 30 Yr]],
                  warn_bps: 0.5, fail_bps: 2}
  yahoo_vs_primary: {warn_bps: 10, fail_bps: 50}
  close_vs_official: {warn_bps: 5, fail_bps: 25}

report:
  recipients_env: REPORT_RECIPIENTS
  headline_instruments: [ES_F, UST_10Y, EURUSD, WTI, VIX]

dashboard:
  mode_env: DESKBRIEF_DISPLAY_MODE
  refresh_seconds: 60
  hosted_hidden_tiers: [1]

# P-024: the brief shared by Home and the email. Starting values; tuning is a normal PR.
brief:
  # The read: a label whose min_met rules are met while no other label has a rule met.
  # Rules look at rankable moves only (T61).
  regime_rules:
    - label: Risk-off
      min_met: 2
      rules:
        - {market: ES_F,   direction: down, min_sigma: 1.0, label: Equity futures down}
        - {market: VIX,    direction: up,   min_sigma: 1.0, label: VIX up}
        - {market: HY_OAS, direction: up,   min_sigma: 1.0, label: High-yield spreads wider}
        - {market: UST_2Y, direction: down, min_sigma: 1.0, label: Front-end yields down}
    - label: Risk-on
      min_met: 2
      rules:
        - {market: ES_F,   direction: up,   min_sigma: 1.0, label: Equity futures up}
        - {market: VIX,    direction: down, min_sigma: 1.0, label: VIX down}
        - {market: HY_OAS, direction: down, min_sigma: 1.0, label: High-yield spreads tighter}
        - {market: UST_2Y, direction: up,   min_sigma: 1.0, label: Front-end yields up}
  quiet_label: Quiet                  # nothing ranked
  mixed_label: Mixed                  # rules met for more than one label
  unclear_label: No clear read        # moves ranked, but no label's rules met far enough
  # Check before using: two related markets whose moves differ by more than limit (pct points),
  # compared over matching windows (gold futures trade overnight, GLD does not; T62 matches them).
  related_pairs:
    - {pair: [BRENT, WTI], limit: 1.0, unit: pct}
    - {pair: [GOLD_F, GLD], limit: 1.0, unit: pct}
  # T66: the morning note. Inert until the owner adds the ANTHROPIC_API_KEY secret.
  note:
    enabled: true
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    max_sentences: 5
    timeout_s: 30
    effort: low                       # adaptive thinking kept short
    max_output_tokens: 8000           # covers thinking + the ~200-token note; thinking must not starve the text
    monthly_cap_usd: 5.0              # pending the owner's confirmation (P-024 open question)
    price_input_usd_per_mtok: 2.0     # claude-sonnet-5-5 list price, for the spend estimate
    price_output_usd_per_mtok: 10.0
    # not used by the templated note (PR #102 round 4: the model writes no words); kept so a
    # free-text note could reuse it. Advice and predictions, then hedged forecasts, as stems
    forbidden_words: [buy, sell, target, price target, will rise, will fall, should, recommend,
                      forecast, predict, expect, outperform, underperform, overweight, underweight,
                      likely, could, may, might, poised, set to, on track, probabl, bound to,
                      will, headed, on course, set for]
