      - {source: ecb, dataset: eurofxref, symbol: USDJPY, tier: 3}
  # T46: an index, not a pair, so kind macro (kind fx requires unit fx_rate). Weekly H.10
  # release with daily values: SeriesSpec lag (sources/fred.py DOLLAR_LAG_BDAYS).
  - id: USD_BROAD
    name: Nominal broad US dollar index
    asset_class: fx
    kind: macro
    unit: index_pts
    feeds:
      - {source: fred, dataset: series, symbol: DTWEXBGS, tier: 3}

  # ---------------- Volatility ----------------
