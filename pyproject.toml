[project]
name = "deskbrief"
version = "0.1.0"
description = "Markets data pipeline, morning report and near-live dashboard that checks its own numbers. Personal project built on public data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pandas>=2.2",
    "pandas-market-calendars>=4.4",
    "pandera>=0.20",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-ulid>=2.7",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "structlog>=24.4",
    "tenacity>=9.0",
    "xlsxwriter>=3.2",
    "yfinance>=0.2.50",
]

[project.scripts]
deskbrief = "deskbrief.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "respx>=0.21",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deskbrief"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "S", "PT", "N"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["deskbrief"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "pandas_market_calendars.*", "boto3.*", "botocore.*", "xlsxwriter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -ra"
markers = [
    "integration: talks to real external services; excluded from PR CI",
]

[tool.coverage.run]
source = ["deskbrief"]
branch = true
omit = ["*/deskbrief/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
