name: history

# P-020, card T53: the one-time history load. Owner-dispatched only (it writes to production
# R2). Each source's plan_range covers the range in a few requests; keys already stored are
# skipped, so an interrupted load is simply dispatched again. No checks, scorecard, serving or
# report. Its own concurrency group: it never queues behind or cancels the scheduled runs.
# Inputs reach the shell only through env vars, and are validated before use.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (ET), YYYY-MM-DD (empty: two years before end)"
        required: false
        default: ""
        type: string
      end:
        description: "Last date, inclusive, YYYY-MM-DD (empty: yesterday, ET)"
        required: false
        default: ""
        type: string
      sources:
        description: "Comma-separated source names (empty: every source with range support)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Print the plan only: no fetch, no writes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deskbrief-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Secrets are set on the "Run history" step only (T55), so checkout, uv sync and input
    # validation never see them. The validated inputs stay job-wide.
    env:
      PYTHONUNBUFFERED: "1"
      IN_START: ${{ inputs.start }}
      IN_END: ${{ inputs.end }}
      IN_SOURCES: ${{ inputs.sources }}
      IN_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Validate inputs
        run: |
          date_re='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          if [ -n "$IN_START" ] && ! [[ "$IN_START" =~ $date_re ]]; then
            echo "::error::start must be YYYY-MM-DD or empty"; exit 2
          fi
          if [ -n "$IN_END" ] && ! [[ "$IN_END" =~ $date_re ]]; then
            echo "::error::end must be YYYY-MM-DD or empty"; exit 2
          fi
          src_re='^[a-z0-9_]+(,[a-z0-9_]+)*$'
          if [ -n "$IN_SOURCES" ] && ! [[ "$IN_SOURCES" =~ $src_re ]]; then
            echo "::error::sources must be comma-separated lowercase names"; exit 2
          fi
          if [ "$IN_DRY_RUN" != "true" ] && [ "$IN_DRY_RUN" != "false" ]; then
            echo "::error::dry_run must be true or false"; exit 2
          fi
      - name: Run history
        env:
          DESKBRIEF_STORAGE_BACKEND: r2
          DESKBRIEF_STORAGE_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          args=()
          if [ -n "$IN_START" ]; then args+=(--start "$IN_START"); fi
          if [ -n "$IN_END" ]; then args+=(--end "$IN_END"); fi
          if [ -n "$IN_SOURCES" ]; then args+=(--sources "$IN_SOURCES"); fi
          if [ "$IN_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          uv run deskbrief history "${args[@]}"
