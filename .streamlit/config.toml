# Minimal, quiet look (spec 10.2). Layout and number styling live in app/theme.py.
[theme]
base = "light"
primaryColor = "#4a5a52"
backgroundColor = "#fbfaf8"
secondaryBackgroundColor = "#f2f0ec"
textColor = "#1f2421"
font = "sans serif"

[client]
toolbarMode = "viewer"
showErrorDetails = false

[server]
runOnSave = false

[browser]
gatherUsageStats = false
