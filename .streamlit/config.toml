# Dark terminal look (spec 10.2, T36). Layout and number styling live in app/theme.py.
[theme]
base = "dark"
primaryColor = "#6ea8ff"
backgroundColor = "#0b0e13"
secondaryBackgroundColor = "#11161d"
textColor = "#e7eaf0"
font = "sans serif"

[client]
toolbarMode = "viewer"
showErrorDetails = false

[server]
runOnSave = false

[browser]
gatherUsageStats = false
